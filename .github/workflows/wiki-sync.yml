# Mirror the repo's wiki/ folder into the GitHub Wiki repository.
#
# Source of truth: wiki/*.md in this repo (canonical, versioned).
# On every push to main that touches wiki/**, this workflow copies the
# pages into Icarus-B4/jarvis-desktop_glas.wiki.git so the GitHub Wiki
# stays in sync with the repository automatically.
#
# Home.md becomes the wiki landing page (GitHub Wiki convention).

name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write   # push to the *.wiki.git repo via GITHUB_TOKEN

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Clone GitHub Wiki repo
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Sync pages (clean copy)
        run: |
          # Remove existing markdown pages so deleted source pages disappear too.
          cd wiki
          find . -maxdepth 1 -type f -name '*.md' -delete || true
          cd ..
          # Copy every page from the repo's wiki/ folder.
          cp -r src/wiki/*.md wiki/

      - name: Commit & push
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git commit -m "docs(wiki): sync from repo wiki/ folder"
          git push
