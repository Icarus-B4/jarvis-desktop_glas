name: Release J.A.R.V.I.S Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  HAS_CERT: ${{ secrets.CODE_SIGN_CERT_PFX != '' && 'true' || 'false' }}
  # electron-builder 25.x publishes automatically when a git tag is present,
  # regardless of publish:[] — it requires GH_TOKEN or it crashes the build.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./apps/bootstrap-installer/src-tauri

      - name: Install JS Dependencies (root workspace)
        run: bun install

      - name: Install bootstrap JS dependencies
        # apps/bootstrap-installer is NOT a root workspace package, so the root
        # `bun install` does NOT populate its node_modules. `cargo tauri build`'s
        # beforeBuildCommand (removed — now a separate step) must have these.
        working-directory: ${{ github.workspace }}/apps/bootstrap-installer
        run: bun install

      - name: Build bootstrap frontend
        # EXPLICIT step: Tauri's beforeBuildCommand spawns a cmd/S/C subshell that
        # does NOT inherit setup-bun's PATH on CI -> `bun: not found` -> exit 1.
        # Building the frontend here (where bun IS on PATH) + --no-bundle (no
        # beforeBuildCommand) avoids the subshell PATH bug entirely...
        working-directory: ${{ github.workspace }}/apps/bootstrap-installer
        run: |
          bun install
          bun run build

      - name: Build desktop app (Electron NSIS installer)
        # --publish never overrides package.json build.publish so electron-builder
        # only BUILDS (no self-upload). softprops/action-gh-release owns the Release.
        run: |
          bun run build
          bunx electron-builder --win --config --publish never
        working-directory: ${{ github.workspace }}

      - name: Locate Electron NSIS installer
        id: electron-installer
        shell: pwsh
        run: |
          $outDir = Join-Path '${{ github.workspace }}' 'release'
          if (-not (Test-Path $outDir)) { throw "release/ directory not found after electron-builder" }
          $exe = Get-ChildItem $outDir -Filter 'JARVIS-Setup-*.exe' -Recurse | Where-Object { $_.Name -notmatch 'block' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Contents of release/:"
            Get-ChildItem $outDir -Recurse -Filter '*.exe' | Select-Object -First 20 | ForEach-Object { Write-Host $_.Name }
            throw 'Electron NSIS installer not found in release/'
          }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host ('Found: ' + $exe.Name)

      - name: Copy win-unpacked into bootstrap resources
        # CRITICAL FIX (Run #14-17 root cause): `cargo tauri build` validates
        # bundle.resources at COMPILE time (tauri_build::build in build.rs).
        # resources/win-unpopped is gitignored (662MB Electron artifact) — absent
        # on a fresh CI runner -> "resource path resources\\win-unpopped doesn't
        # exist" -> build.rs exit code 1 -> Build bootstrap installer: failure.
        # Copy the Electron win-unpopped (from the step above) into the bootstrap
        # resources/ so the path resolves. VERIFIED locally: cargo tauri build
        # succeeds the instant resources/win-unpopped exists (1m28s, exit 0).
        # NOTE: on CI the Electron build puts win-unpacked into a SUB-DIRECTORY
        # (e.g. release/win/ or release/win64/) — so we search RECURSIVELY under
        # release/, not assume it sits directly in release/ (unlike localhost).
        shell: pwsh
        run: |
          $release = Join-Path '${{ github.workspace }}' 'release'
          if (-not (Test-Path $release)) { throw "release/ directory not found after electron-builder" }
          $src = Get-ChildItem $release -Directory -Recurse -Filter 'win-unpacked' | Select-Object -First 1
          if (-not $src) {
            Write-Host "Contents of release/:"
            Get-ChildItem $release -Recurse | Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }
            throw 'Electron win-unpacked directory not found in release/'
          }
          $dst = Join-Path '${{ github.workspace }}' 'apps/bootstrap-installer/src-tauri/resources/win-unpacked'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          # robocopy exit codes: 0=nothing copied, 1=files copied (SUCCESS),
          # 2-7=minor, 8+=real failure. CI treats any non-zero as step failure.
          # Run robocopy WITHOUT a pipe so $LASTEXITCODE stays robocopy's own code,
          # then mask 0-7 as success. (Piping to Out-Null overwrites $LASTEXITCODE.)
          $rc = robocopy "$($src.FullName)" "$dst" /E /NFL /NDL /NJS /NJH
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $n = (Get-ChildItem -Recurse -File $dst).Count
          Write-Host ("win-unpopped copied -> " + $dst + " (" + $n + " files, from " + $src.FullName + ")")
          # Force success: robocopy returns 1 on success, which persists in
          # $LASTEXITCODE (Write-Host is a cmdlet and does NOT reset it), so pwsh
          # would otherwise exit 1 and fail the step. Explicit exit 0 overrides.
          exit 0

      - name: Install tauri-cli (provides the `cargo tauri` subcommand)
        # Pin v2.4.0: latest 2.11.x fails — yanked arrayref (tiny-skia/resvg).
        run: cargo install tauri-cli --version 2.4.0 --locked

      - name: Build bootstrap installer (Tauri, drives install.ps1)
        # FULL bundle (NOT --no-bundle): Tauri only copies bundle.resources
        # (install.ps1 + win-unpacked) NEXT TO the exe during the NSIS bundle
        # step. With --no-bundle those resources are NOT placed beside the exe,
        # so resolve_install_script() fails -> installer hangs at 0% (the
        # "nothing happens" bug). The NSIS setup .exe is a bonus artifact; we
        # only publish the standalone jarvis-bootstrap-setup.exe below.
        # webviewInstallMode is onlineInstall (not downloadBootstrapper) to avoid
        # a network download that hangs on a clean runner during bundle creation.
        # CARGO_TARGET_DIR moved to $TEMP to dodge Defender os error 32.
        # NOTE: the exe is built into $CARGO_TARGET_DIR/release, NOT src-tauri/
        # target/release — so the Locate step MUST use the same CARGO_TARGET_DIR.
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\jarvis-bootstrap-target
          CARGO_INCREMENTAL: 0
        run: |
          cd ${{ github.workspace }}/apps/bootstrap-installer/src-tauri
          cargo tauri build
          Write-Host "=== built exe ==="
          $exe = Join-Path "${{ runner.temp }}" 'jarvis-bootstrap-target/release/jarvis-bootstrap-setup.exe'
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          Write-Host ("OK: " + $exe)
          # Sanity: confirm the bundled resources landed next to the exe.
          $resDir = Join-Path "${{ runner.temp }}" 'jarvis-bootstrap-target/release/resources'
          if (-not (Test-Path (Join-Path $resDir 'install.ps1'))) {
            throw "install.ps1 missing next to exe — bundle.resources not embedded (installer would hang at 0%)"
          }
          Write-Host ("resources present: " + $resDir)
          exit 0

      - name: Locate bootstrap exe
        id: bootstrap-exe
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\\jarvis-bootstrap-target
        run: |
          $dir = Join-Path "${{ runner.temp }}" 'jarvis-bootstrap-target/release'
          $exe = Get-ChildItem $dir -Filter 'jarvis-bootstrap-setup.exe' | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Contents of $dir :"
            Get-ChildItem $dir -Filter '*.exe' | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }
            throw 'Bootstrap exe (jarvis-bootstrap-setup.exe) not found'
          }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host ('Bootstrap: ' + $exe.Name)
          exit 0

      - name: Publish GitHub Release
        # softprops creates the Release (tag=v*) + uploads BOTH the NSIS
        # installer (electron-builder) and the bootstrap exe (Tauri).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: J.A.R.V.I.S. Desktop v${{ github.ref_name }}
          files: |
            ${{ steps.electron-installer.outputs.path }}
            ${{ steps.bootstrap-exe.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
