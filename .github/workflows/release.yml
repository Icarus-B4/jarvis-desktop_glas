name: Release J.A.R.V.I.S Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  HAS_CERT: ${{ secrets.CODE_SIGN_CERT_PFX != '' && 'true' || 'false' }}
  # electron-builder 25.x publishes automatically when a git tag is present,
  # regardless of publish:[] — it requires GH_TOKEN or it crashes the build.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./apps/bootstrap-installer/src-tauri

      - name: Install JS Dependencies
        run: bun install

      - name: Install bootstrap JS dependencies
        # apps/bootstrap-installer is NOT a root workspace package, so the root
        # `bun install` does NOT populate its node_modules — `cargo tauri build`'s
        # beforeBuildCommand (`bun run build`) would crash without this.
        working-directory: ${{ github.workspace }}/apps/bootstrap-installer
        run: bun install

      - name: Build desktop app (Electron NSIS installer)
        # --publish never overrides package.json build.publish so electron-builder
        # only BUILDS (no self-upload). softprops/action-gh-release owns the Release.
        run: |
          bun run build
          bunx electron-builder --win --config --publish never
        working-directory: ${{ github.workspace }}

      - name: Locate Electron NSIS installer
        id: electron-installer
        shell: pwsh
        run: |
          $outDir = Join-Path '${{ github.workspace }}' 'release'
          if (-not (Test-Path $outDir)) { throw "release/ directory not found after electron-builder" }
          $exe = Get-ChildItem $outDir -Filter 'JARVIS-Setup-*.exe' -Recurse | Where-Object { $_.Name -notmatch 'block' } | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Contents of release/:"; Get-ChildItem $outDir -Recurse -Filter '*.exe' | Select-Object -First 20 | ForEach-Object { Write-Host $_.Name }
            throw 'Electron NSIS installer not found in release/'
          }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host ('Found: ' + $exe.Name)

      - name: Install tauri-cli (provides the `cargo tauri` subcommand)
        # Pin v2.4.0: latest 2.11.x fails — yanked arrayref (tiny-skia/resvg).
        run: cargo install tauri-cli --version 2.4.0 --locked

      - name: Build bootstrap frontend
        # Built EXPLICITLY here because Tauri's `beforeBuildCommand` spawns a
        # `cmd /S /C` subshell that does NOT inherit GitHub's setup-bun PATH
        # on CI (fresh-carho home, bun missing in subshell → beforeBuildCommand
        # exit 1 → `cargo tauri build` "failure"). Root cause of 13 red runs.
        working-directory: ${{ github.workspace }}/apps/bootstrap-installer
        run: |
          bun install
          bun run build

      - name: Build bootstrap installer (Tauri, drives install.ps1)
        # Per harness-hj-desktop-dev: `cargo tauri build` MUST build the full
        # NSIS bundle (injects WebView2 bootstrapper + produces the signed-ready
        # NSIS). `--no-bundle` produced a bare exe that crashes on clean machines.
        # CARGO_TARGET_DIR outside the repo ($TEMP) — `Webdesign\` is scanned by
        # Windows Defender which causes `os error 32` file-locks on parallel .rmeta
        # compiles -> build.rs (exit code 1) crash. The target-dir redirect is the
        # verified fix from references/bootstrap-installer-verified-fixes.md.
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\jarvis-bootstrap-target
          CARGO_INCREMENTAL: 0
        run: |
          cd ${{ github.workspace }}/apps/bootstrap-installer/src-tauri
          cargo tauri build
          Write-Host "=== dist/ contents ==="
          gci target/release -Filter '*.exe' -Recurse | select -First 10 | % { Write-Host $_.Name }

      - name: Locate bootstrap exe
        id: bootstrap-exe
        shell: pwsh
        run: |
          $dir = Join-Path '${{ github.workspace }}' 'apps\bootstrap-installer\src-tauri\target\release'
          $exe = Get-ChildItem $dir -Filter 'jarvis-bootstrap-setup.exe' | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Contents of target/release/:"; Get-ChildItem $dir -Filter '*.exe' | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }
            throw 'Bootstrap exe (jarvis-bootstrap-setup.exe) not found'
          }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host ('Bootstrap: ' + $exe.Name)

      - name: Publish GitHub Release
        # softprops creates the Release (tag=v*) + uploads BOTH the NSIS
        # installer (electron-builder) and the bootstrap exe (Tauri).
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: J.A.R.V.I.S. Desktop v${{ github.ref_name }}
          files: |
            ${{ steps.electron-installer.outputs.path }}
            ${{ steps.bootstrap-exe.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
