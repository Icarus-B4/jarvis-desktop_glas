name: Release J.A.R.V.I.S Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  HAS_CERT: ${{ secrets.CODE_SIGN_CERT_PFX != '' && 'true' || 'false' }}
  # electron-builder 25.x publishes automatically when a git tag is present,
  # regardless of publish:[] — it requires GH_TOKEN or it crashes the build.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./apps/bootstrap-installer/src-tauri

      - name: Install JS Dependencies (root workspace)
        run: bun install

      - name: Install bootstrap JS dependencies
        # apps/bootstrap-installer is NOT a root workspace package, so the root
        # `bun install` does NOT populate its node_modules. `cargo tauri build`'s
        # beforeBuildCommand (removed — now a separate step) must have these.
        working-directory: ${{ github.workspace }}/apps/bootstrap-installer
        run: bun install

      - name: Build bootstrap web UI
        # Tauri's frontendDist is ../dist (apps/bootstrap-installer/dist).
        # On a clean checkout that dir does not exist, so cargo tauri build fails
        # with "Unable to find your web assets". Build the Vite UI first.
        working-directory: ${{ github.workspace }}/apps/bootstrap-installer
        run: bun run build

      - name: Strip secret env before build (no keys in release)
        # Hard guard: ensure no API keys leak into the bundled app. electron-builder
        # would otherwise pick up a local .env via main.ts loadEnvFile().
        shell: pwsh
        run: |
          $env:XAI_API_KEY = ''
          $env:TAVILY_API_KEY = ''
          $env:FISH_AUDIO_API_KEY = ''
          $env:ANTHROPIC_API_KEY = ''
          $env:OPENAI_API_KEY = ''
          Write-Host "Secret env cleared for build."

      - name: Build desktop app (Electron win-unpacked only)
        # Builds win-unpacked (the Electron app the bootstrap will install).
        # --dir = no installer packaging (NSIS removed); --publish never so
        # electron-builder only builds, no self-upload. softprops owns the Release.
        # Secret env is empty (stripped above) so no keys are baked in.
        run: |
          bun run build
          bunx electron-builder --win --config --publish never --dir
        working-directory: ${{ github.workspace }}

      - name: Copy win-unpacked into bootstrap resources
        # `cargo tauri build` validates bundle.resources at COMPILE time, so
        # resources/win-unpacked must exist on the runner. Copy the Electron
        # win-unpacked (from the step above) into the bootstrap resources/.
        shell: pwsh
        run: |
          $release = Join-Path '${{ github.workspace }}' 'release'
          if (-not (Test-Path $release)) { throw "release/ directory not found after electron-builder" }
          $src = Get-ChildItem $release -Directory -Recurse -Filter 'win-unpacked' | Select-Object -First 1
          if (-not $src) {
            Write-Host "Contents of release/:"
            Get-ChildItem $release -Recurse | Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }
            throw 'Electron win-unpacked directory not found in release/'
          }
          $dst = Join-Path '${{ github.workspace }}' 'apps/bootstrap-installer/src-tauri/resources/win-unpacked'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $rc = robocopy "$($src.FullName)" "$dst" /E /NFL /NDL /NJS /NJH
          if ($LASTEXITCODE -gt 7) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $n = (Get-ChildItem -Recurse -File $dst).Count
          Write-Host ("win-unpacked copied -> " + $dst + " (" + $n + " files, from " + $src.FullName + ")")
          exit 0

      - name: Install tauri-cli (provides the `cargo tauri` subcommand)
        # Pin v2.4.0: latest 2.11.x fails — yanked arrayref (tiny-skia/resvg).
        run: cargo install tauri-cli --version 2.4.0 --locked

      - name: Build bootstrap installer (Tauri, drives install.ps1)
        # FULL bundle (NOT --no-bundle): Tauri only copies bundle.resources
        # (install.ps1 + win-unpacked) NEXT TO the exe during the NSIS bundle
        # step. With --no-bundle those resources are NOT placed beside the exe,
        # so resolve_install_script() fails -> installer hangs at 0% (the
        # "nothing happens" bug). The NSIS setup .exe is a bonus artifact; we
        # only publish the standalone jarvis-bootstrap-setup.exe below.
        # webviewInstallMode is onlineInstall (not downloadBootstrapper) to avoid
        # a network download that hangs on a clean runner during bundle creation.
        # CARGO_TARGET_DIR moved to $TEMP to dodge Defender os error 32.
        # NOTE: the exe is built into $CARGO_TARGET_DIR/release, NOT src-tauri/
        # target/release — so the Locate step MUST use the same CARGO_TARGET_DIR.
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\jarvis-bootstrap-target
          CARGO_INCREMENTAL: 0
        run: |
          cd ${{ github.workspace }}/apps/bootstrap-installer/src-tauri
          cargo tauri build
          Write-Host "=== built exe ==="
          $exe = Join-Path "${{ runner.temp }}" 'jarvis-bootstrap-target/release/jarvis-bootstrap-setup.exe'
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          Write-Host ("OK: " + $exe)
          exit 0

      - name: Locate bootstrap exe
        id: bootstrap-exe
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\\jarvis-bootstrap-target
        run: |
          $dir = Join-Path "${{ runner.temp }}" 'jarvis-bootstrap-target/release'
          $exe = Get-ChildItem $dir -Filter 'jarvis-bootstrap-setup.exe' | Select-Object -First 1
          if (-not $exe) {
            Write-Host "Contents of $dir :"
            Get-ChildItem $dir -Filter '*.exe' | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }
            throw 'Bootstrap exe (jarvis-bootstrap-setup.exe) not found'
          }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host ('Bootstrap: ' + $exe.Name)
          exit 0

      - name: Publish GitHub Release
        # Only the bootstrap exe (jarvis-bootstrap-setup.exe) is published — the
        # NSIS installer is removed; the bootstrap does the full install itself.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: J.A.R.V.I.S. Desktop v${{ github.ref_name }}
          files: |
            ${{ steps.bootstrap-exe.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
