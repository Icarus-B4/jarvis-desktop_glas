# Mirror cubic AI-wiki export (.cubic/wiki) into the GitHub Wiki repo.
#
# Prerequisites:
#   1. Enable cubic "Repo sync" on the wiki card (cubic.dev/wiki) so the
#      markdown export lands in .cubic/wiki and is merged to main.
#   2. This workflow pushes that content to Icarus-B4/jarvis-desktop_glas.wiki.git.
#   3. GitHub Wiki must be enabled for the repo (it is: .wiki.git exists).
#
# GitHub Wiki naming: the file Home.md (or Home.markdown) becomes the wiki
# landing page. We map cubic's index.md -> Home.md so the intro shows up first.

name: Mirror cubic Wiki -> GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - '.cubic/wiki/**'
  workflow_dispatch:

permissions:
  contents: write   # needed to push to the *.wiki.git repo via GITHUB_TOKEN

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: src

      - name: Bail if no wiki export yet
        id: check
        run: |
          if [ ! -d "src/.cubic/wiki" ]; then
            echo "No .cubic/wiki directory found — cubic Repo sync not enabled yet. Skipping."
            echo "has_wiki=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_wiki=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone GitHub Wiki repo
        if: steps.check.outputs.has_wiki == 'true'
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki
          # Start clean: keep only history, drop old pages so removed wiki
          # pages disappear from the GitHub Wiki too.
          cd wiki
          find . -maxdepth 1 -type f -name '*.md' -delete || true
          cd ..

      - name: Copy cubic export into wiki
        if: steps.check.outputs.has_wiki == 'true'
        run: |
          SRC="src/.cubic/wiki"
          DST="wiki"
          # Copy every markdown page (one file per wiki page, organized by section).
          cp -r "$SRC"/*.md "$DST"/ 2>/dev/null || true
          # Map cubic's index.md (table of contents) to GitHub Wiki Home page.
          if [ -f "$SRC/index.md" ]; then
            cp "$SRC/index.md" "$DST/Home.md"
          fi

      - name: Commit & push to wiki
        if: steps.check.outputs.has_wiki == 'true'
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git commit -m "chore(wiki): sync from cubic AI-wiki export"
          git push
