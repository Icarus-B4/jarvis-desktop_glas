[package]
name = "jarvis-bootstrap-installer"
version = "0.1.0"
description = "J.A.R.V.I.S. Desktop — Bootstrap Installer (drives install.ps1)"
authors = ["J.A.R.V.I.S."]
edition = "2021"

[[bin]]
name = "jarvis-bootstrap-setup"
path = "src/main.rs"

[lib]
name = "jarvis_bootstrap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "process", "io-util", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[features]
default = []
