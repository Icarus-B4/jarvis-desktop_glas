name: Release Harness H&J

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.47)'
        required: true
        default: '0.1.47'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  HAS_CERT: ${{ secrets.CODE_SIGN_CERT_PFX != '' && 'true' || 'false' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri
            ./bootstrap-installer/src-tauri

      - name: Install JS dependencies
        run: |
          bun install
          bun install --cwd hermes-bridge

      - name: Build main app (Next.js standalone + resources)
        run: bun run build:desktop
        working-directory: ${{ github.workspace }}

      - name: Build main installer (Tauri NSIS)
        run: bunx tauri build --bundles nsis
        working-directory: ${{ github.workspace }}/src-tauri

      - name: Patch installer.nsi to wipe stale node_modules on upgrade
        shell: pwsh
        run: |
          $nsisDir = Join-Path '${{ github.workspace }}' 'src-tauri\target\release\bundle\nsis'
          & (Join-Path '${{ github.workspace }}' 'scripts\patch-installer-cleanup.ps1') -NsisDir $nsisDir

      - name: Recompile patched installer.nsi
        shell: pwsh
        run: |
          $nsisDir = Join-Path '${{ github.workspace }}' 'src-tauri\target\release\bundle\nsis'
          $makensis = Join-Path $env:LOCALAPPDATA 'tauri\NSIS\nsis.exe'
          if (-not (Test-Path $makensis)) {
            $found = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'tauri\NSIS') -Filter nsis.exe -Recurse | Select-Object -First 1
            if (-not $found) { throw 'makensis not found' }
            $makensis = $found.FullName
          }
          $nsi = Get-ChildItem $nsisDir -Filter installer.nsi | Select-Object -First 1
          if (-not $nsi) { Write-Host 'No installer.nsi present — skipping recompile'; exit 0 }
          & $makensis '/INPUTCHARSET=UTF8' $nsi.FullName
          if ($LASTEXITCODE -ne 0) { throw 'makensis failed' }
          $setup = Get-ChildItem $nsisDir -Filter 'Harness H&J_*_x64-setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($setup) {
            Move-Item -LiteralPath (Join-Path $nsisDir 'nsis-output.exe') -Destination $setup.FullName -Force
            Write-Host ('Recompiled -> ' + $setup.Name)
          } else {
            Write-Host 'nsis-output.exe kept (no final setup name matched)'
          }

      - name: Build bootstrap installer (Rust, embeds main installer)
        shell: pwsh
        run: |
          $nsisDir = Join-Path '${{ github.workspace }}' 'src-tauri\target\release\bundle\nsis'
          $nsis = Get-ChildItem $nsisDir -Filter 'Harness H&J_*_x64-setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nsis) { throw 'Main installer not found' }
          echo "HARNESS_INTERNAL_INSTALLER=$($nsis.FullName)" >> $env:GITHUB_ENV

      - name: Import code-signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        env:
          CODE_SIGN_CERT_PFX: ${{ secrets.CODE_SIGN_CERT_PFX }}
          CODE_SIGN_CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path '${{ github.workspace }}' 'signing-cert.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:CODE_SIGN_CERT_PFX))
          $securePass = ConvertTo-SecureString -String $env:CODE_SIGN_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass
          "SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host ('Certificate imported: ' + $cert.Subject)

      - name: Sign all EXEs (defeats SmartScreen/Defender false positive)
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits'
          $signtool = Get-ChildItem $sdk -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in Windows SDK' }
          $signtool = $signtool.FullName
          $exes = @(
            (Get-ChildItem (Join-Path '${{ github.workspace }}' 'bootstrap-installer\src-tauri\target\release\Harness-HJ-Setup.exe') | Select-Object -First 1).FullName,
            (Get-ChildItem (Join-Path '${{ github.workspace }}' 'src-tauri\target\release\bundle\nsis') -Filter 'Harness H&J_*_x64-setup.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          ) | Where-Object { $_ -and (Test-Path $_) }
          foreach ($exe in $exes) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /sha1 $env:SIGN_THUMBPRINT $exe
            if ($LASTEXITCODE -ne 0) { throw ('Signing failed for ' + $exe) }
            Write-Host ('Signed: ' + $exe)
          }

      - name: Cargo build bootstrap
        run: cargo build --release
        working-directory: ${{ github.workspace }}/bootstrap-installer/src-tauri

      - name: Upload bootstrap installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harness-HJ-Setup
          path: ${{ github.workspace }}/bootstrap-installer/src-tauri/target/release/Harness-HJ-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/bootstrap-installer/src-tauri/target/release/Harness-HJ-Setup.exe
            ${{ github.workspace }}/src-tauri/target/release/bundle/nsis/Harness H&J_*_x64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
